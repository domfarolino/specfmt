  <p>The following example shows an image that is described by prose:
  <img src="cats.png" alt="Four cats sitting on a fence, looking at the camera"> and the prose
  continues after the image for a little while longer.</p>

  <p><img src="/images/parsing-model-overview.svg" alt="A diagram of the parsing model" width="837" height="326"></p>

  <p>An image whose alt text contains a greater-than sign: <img src="math.png" alt="1 > 0"> stays in
  one piece, and so does the sentence around it.</p>
